[package]
name = "forester-client-http"
description = "HTTP client for the Forester behavior tree runtime."
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
authors = ["BorisZhguchev <zhguchev@hotmail.com>"]
homepage = "https://github.com/besok/forester"
repository = "https://github.com/besok/forester"
keywords = ["forester", "behavior-tree", "client", "http"]
categories = ["api-bindings", "web-programming"]

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
