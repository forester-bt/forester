[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forester-client-http"
version = "0.6.0"
description = "Python HTTP client for the Forester behavior tree runtime."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.0"]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "BorisZhguchev", email = "zhguchev@hotmail.com" },
]
keywords = ["forester", "behavior-tree", "client", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/besok/forester"
Repository = "https://github.com/besok/forester"
Documentation = "https://github.com/besok/forester"

[tool.setuptools]
packages = ["forester_client_http"]

[tool.setuptools.package-data]
forester_client_http = ["py.typed"]
