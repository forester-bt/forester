name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate OpenAPI spec
        run: cargo run --bin gen-openapi
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: openapi.json
